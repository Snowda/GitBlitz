# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
# Modeled on C:/Git/Barrel/deny.toml. release_gate's `default.deny` control runs `cargo deny check`.

[graph]
# Check the `cli` (serde) and `list` (ignore) trees too, not only the default build.
all-features = true

[advisories]
# Fail on any active RustSec advisory (vulnerabilities, unmaintained, unsound) and yanked crates.
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licenses, as in Barrel; strong copyleft (GPL / LGPL) stays disallowed by omission.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "Unlicense",
    "MIT-0",
    "CC0-1.0",
    "NCSA",
    "CDLA-Permissive-2.0",
    # MPL-2.0 is weak, file-level copyleft — safe to depend on unmodified.
    "MPL-2.0",
]
confidence-threshold = 0.8
# As in Barrel: skip license policy for unpublished crates. GitBlitz is publishable, so its license is checked.
private = { ignore = true }

[bans]
multiple-versions = "warn"
# Wildcard version requirements (e.g. `serde = "*"`) are forbidden — pin to a major.
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # Hermetic, cross-compilable builds only — TLS must go through rustls, never openssl.
    { name = "openssl" },
    { name = "openssl-sys" },
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
